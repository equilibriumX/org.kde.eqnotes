<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset=".48" stop-color="#f7ed0c"/>
      <stop offset="1" stop-color="#ffb14b"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8790"/>
      <stop offset="1" stop-color="#353b42"/>
    </linearGradient>
    <radialGradient id="highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".58" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <clipPath id="pageClip">
      <path d="M29 188 L54 57 Q58 31 82 27 L187 46 Q211 50 216 73 L231 166 Q235 190 214 204 L78 227 Q39 233 29 203Z"/>
    </clipPath>
  </defs>

  <!-- Scale the complete icon around its center so it fills the 256x256 canvas -->
  <g transform="translate(128 128) scale(1.14) translate(-128 -128)">
    <!-- soft grounding shadow -->
    <path d="M34 219 L53 65 Q57 38 82 33 L190 52 Q215 56 220 82 L232 177 Q235 202 214 216 L78 238 Q45 243 34 219Z"
          fill="#111820" opacity=".24" filter="url(#shadow)"/>

    <!-- page body, extruded lower edge -->
    <path d="M34 198 L58 61 Q62 39 84 35 L188 53 Q211 57 215 79 L229 173 Q232 194 213 207 L78 231 Q43 237 34 211Z"
          fill="url(#side)" stroke="#303840" stroke-width="1.2"/>
    <path d="M29 188 L54 57 Q58 31 82 27 L187 46 Q211 50 216 73 L231 166 Q235 190 214 204 L78 227 Q39 233 29 203Z"
          fill="url(#page)" stroke="#e96a0b" stroke-width="1.5"/>

    <!-- reflections clipped to the page surface -->
    <g clip-path="url(#pageClip)">
      <path d="M 35 43
        C 39 30, 52 24, 64 25
        C 53 28, 43 36, 39 48
        C 36 54, 32 53, 35 43 Z"
        fill="#FFFFFF" opacity="0.28"
        transform="translate(48 39) scale(2) translate(-48 -39)"/>

      <path d="M 31 79
        C 80 103, 76 111, 96 88
        C 84 108, 53 114, 34 96 Z"
        fill="#FFFFFF" opacity="0.12"
        transform="translate(63.5 96.5) scale(2) translate(-63.5 -96.5)"/>
    </g>

    <!-- raised text lines and EQ lettering -->
    <g stroke-linecap="round">
      <path d="M91 91 L151 102" stroke="#a33b08" stroke-width="9" opacity=".45"/>
      <path d="M81 121 L181 139" stroke="#a33b08" stroke-width="10" opacity=".45"/>
      <path d="M69 151 L149 165" stroke="#a33b08" stroke-width="10" opacity=".45"/>
      <text x="46" y="200" fill="#152020"
            font-family="DejaVu Sans, Arial, sans-serif"
            font-size="30" font-weight="700" letter-spacing="-2">EQ-Notes</text>
    </g>
  </g>
</svg>
